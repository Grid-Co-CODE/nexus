<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos e Prontuário · Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* Mockup (13/11/2026) das duas visões pedidas pela Ana: Contratos e Prontuário da usina, para a avaliação de Contratos e
   dos setores. Tokens do nexus.css (tema escuro navy, verde Grid). Dados ilustrativos: cliente, CNPJ, pessoas e usinas
   são fictícios. Um nível de superfície: as seções direto no fundo, a cor só no estado. */
:root{
  --fundo:#090d18;--superficie:#161d30;--superficie-2:#1c2640;--superficie-3:#243154;--barra:#0d1526;
  --tinta:#e9eef6;--tinta-2:#c3cad7;--mudo:#96a0b4;--fraco:#767d92;
  --linha:rgba(255,255,255,.09);--linha-forte:rgba(255,255,255,.16);
  --verde:#a3d900;--verde-suave:rgba(163,217,0,.12);--verde-texto:#c4e755;--sobre-verde:#10170a;
  --ok:#4ade80;--ok-suave:rgba(74,222,128,.14);--alerta:#ffd83d;--alerta-suave:rgba(255,216,61,.14);
  --severo:#ff8f3c;--severo-suave:rgba(255,143,60,.15);--critico:#ff5b6e;--critico-suave:rgba(255,91,110,.14);
  --info:#7fb8ff;--info-suave:rgba(91,157,255,.14);--semcom:#b39dff;--semcom-suave:rgba(179,157,255,.14);
  --font-sans:"Poppins",system-ui,sans-serif;--font-mono:"IBM Plex Mono",Consolas,monospace;
  --raio-tag:6px;--raio-controle:8px;--raio-md:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 13.5px/1.5 var(--font-sans)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde-texto)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mudo{color:var(--mudo)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

/* casca */
.topo{display:flex;align-items:center;gap:14px;height:56px;padding:0 20px;background:var(--barra);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:20}
.marca{font:700 17px/1 var(--font-sans);letter-spacing:-.01em}.marca b{color:var(--verde)}
.marca span{margin-left:12px;padding-left:12px;border-left:1px solid var(--linha-forte);font-weight:600}
.topo-dir{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--verde-suave);color:var(--verde-texto);display:grid;place-items:center;font:700 12px/1 var(--font-sans)}
.selo-mock{font:600 11px/1 var(--font-sans);color:var(--mudo);border:1px dashed var(--linha-forte);padding:5px 9px;border-radius:999px}
.casca{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 56px)}
.menu{background:var(--barra);border-right:1px solid var(--linha);padding:14px 10px}
.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--raio-controle);color:var(--verde-texto);text-decoration:none;font-weight:600;font-size:13px}
.menu a .ph{font-size:16px}.menu .sub{padding-left:36px;font-weight:500;color:var(--tinta-2)}
.menu a[aria-current="page"]{background:var(--verde-suave);color:var(--tinta)}
main{padding:22px 28px 70px;min-width:0;max-width:1320px}

/* cabeçalhos */
.eyebrow{margin:0;font:700 11px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--verde-texto)}
h1{margin:6px 0 4px;font:700 26px/1.2 var(--font-sans);letter-spacing:-.02em}
h2{margin:0;font:700 16px/1.3 var(--font-sans)}
h3{margin:0;font:600 13.5px/1.3 var(--font-sans)}
.sub-t{margin:2px 0 0;color:var(--mudo);font-size:12.5px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:var(--raio-controle);border:1px solid var(--linha-forte);background:transparent;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--superficie-2)}
.btn--prim{background:var(--verde);border-color:var(--verde);color:var(--sobre-verde)}
.btn--prim:hover{background:#8bbf00}
.btn--mini{padding:4px 9px;font-size:12px}
.sel{padding:7px 10px;border-radius:var(--raio-controle);border:1px solid var(--linha-forte);background:var(--superficie);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--linha-forte);border-radius:var(--raio-controle);overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--tinta-2)}
.seg button[aria-pressed="true"]{background:var(--verde-suave);color:var(--tinta)}
.seg button+button{border-left:1px solid var(--linha-forte)}

/* faixa do contrato */
.ficha{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin:18px 0 0;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.ficha div{padding:12px 14px;border-right:1px solid var(--linha);min-width:0}
.ficha div:last-child{border-right:0}
.ficha small{display:block;color:var(--mudo);font-size:11.5px;margin-bottom:3px}
.ficha b{font-weight:600;font-size:13.5px;display:block;overflow-wrap:anywhere}
.ficha .d{color:var(--mudo);font-size:11.5px;display:block}
.chips-usinas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip-u{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--linha);color:var(--tinta-2)}
.chip-u .num{color:var(--mudo);margin-left:4px}

.abas{display:flex;gap:2px;margin:22px 0 0;border-bottom:1px solid var(--linha);overflow-x:auto}
.abas a{padding:10px 13px;color:var(--tinta-2);text-decoration:none;font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.abas a[aria-current="page"]{color:var(--tinta);border-color:var(--verde)}
.abas a b{margin-left:6px;font-size:11px;color:var(--critico)}
.secao{margin-top:22px}
.secao-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.faixa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--linha);background:transparent;color:var(--tinta-2);font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-suave);color:var(--tinta)}
.chip b{color:var(--tinta);font-weight:600}

/* tabela (a única superfície) */
.tab{width:100%;border-collapse:collapse;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md);overflow:hidden;font-size:13px}
.tab th{text-align:left;font:600 11px/1.2 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mudo);padding:10px 12px;border-bottom:1px solid var(--linha);background:var(--barra);white-space:nowrap}
.tab td{padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.tab td.c,.tab th.c{text-align:center}
.tab td.r,.tab th.r{text-align:right}
.tab tr.grupo td{background:var(--barra);font:600 12px/1 var(--font-sans);color:var(--verde-texto);padding:9px 12px;letter-spacing:.02em}
.rolavel{overflow-x:auto;border-radius:var(--raio-md)}
.regra-nome{font-weight:600}
.regra-meta{display:block;color:var(--mudo);font-size:11.5px;margin-top:2px}
.riscado{color:var(--fraco);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.vazio-c{color:var(--fraco)}
.quem{display:block;color:var(--mudo);font-size:11.5px}
.hist{margin:8px 0 0;padding:10px 12px;border-left:2px solid var(--linha-forte);background:var(--barra);border-radius:0 var(--raio-controle) var(--raio-controle) 0;font-size:12px}
.hist li{margin:0 0 8px;list-style:none}.hist li:last-child{margin:0}
.hist ul{margin:0;padding:0}
.hist q{display:block;color:var(--tinta-2);quotes:none;margin-top:2px}
.linkbtn{border:0;background:none;padding:0;color:var(--verde-texto);cursor:pointer;font-size:12px;font-weight:600}

/* selos */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/16px var(--font-sans);padding:3px 9px;border-radius:var(--raio-tag);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:var(--ok-suave)}.t-alerta{color:var(--alerta);background:var(--alerta-suave)}
.t-severo{color:var(--severo);background:var(--severo-suave)}.t-critico{color:var(--critico);background:var(--critico-suave)}
.t-info{color:var(--info);background:var(--info-suave)}.t-neutro{color:var(--mudo);background:var(--superficie-2)}
.t-verde{color:var(--verde-texto);background:var(--verde-suave)}.t-semcom{color:var(--semcom);background:var(--semcom-suave)}
.c-ok{color:var(--ok)}.c-alerta{color:var(--alerta)}.c-critico{color:var(--critico)}.c-severo{color:var(--severo)}
.ponto{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:1px}
.p-ok{background:var(--ok)}.p-alerta{background:var(--alerta)}.p-critico{background:var(--critico)}.p-neutro{background:var(--superficie-3);box-shadow:inset 0 0 0 1px var(--linha-forte)}.p-severo{background:var(--severo)}.p-semcom{background:var(--semcom)}

/* calendário */
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mudo)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--linha);border-radius:var(--raio-md);overflow:hidden;background:var(--superficie)}
.cal .dsem{padding:8px 10px;font:600 11px/1 var(--font-sans);color:var(--mudo);text-transform:uppercase;letter-spacing:.05em;background:var(--barra);border-bottom:1px solid var(--linha)}
.cal .dia{min-height:104px;padding:7px 7px 8px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .dia:nth-child(7n){border-right:0}
.cal .dia.fora{background:rgba(0,0,0,.18)}
.cal .dia.hoje{box-shadow:inset 0 0 0 1px var(--verde)}
.cal .n{font:600 12px/1 var(--font-mono);color:var(--tinta-2);margin-bottom:2px}
.cal .dia.hoje .n{color:var(--verde-texto)}
.cal .fer{font-size:10.5px;color:var(--mudo)}
.ev{display:block;font-size:11px;line-height:1.3;padding:3px 6px;border-radius:5px;border-left:3px solid;background:var(--superficie-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.ev.ok{border-color:var(--ok)}.ev.alerta{border-color:var(--alerta)}.ev.critico{border-color:var(--critico)}.ev.neutro{border-color:var(--superficie-3);color:var(--tinta-2)}
.grade2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.lista-lat h3{margin-bottom:8px}
.lista-lat ul{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--linha)}
.lista-lat li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--linha);font-size:12.5px}
.lista-lat li .ponto{margin-top:5px}
.lista-lat small{display:block;color:var(--mudo)}
.ano{width:100%;border-collapse:collapse;font-size:12px}
.ano th{font:600 10.5px/1 var(--font-sans);color:var(--mudo);text-transform:uppercase;padding:6px 2px;text-align:center}
.ano th:first-child{text-align:left}
.ano td{padding:5px 2px;text-align:center;border-top:1px solid var(--linha)}
.ano td:first-child{text-align:left;white-space:nowrap;padding-right:10px;color:var(--tinta-2)}
.cel{display:inline-block;width:100%;max-width:38px;height:16px;border-radius:4px}

/* entregáveis */
.marco-cab{display:flex;justify-content:space-between;gap:10px;align-items:center}
.barra-prog{height:6px;border-radius:999px;background:var(--superficie-3);overflow:hidden;width:120px}
.barra-prog i{display:block;height:100%;background:var(--ok)}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px}
.check input{width:16px;height:16px;accent-color:var(--verde);cursor:pointer}
.carimbo{display:block;color:var(--mudo);font-size:11px;margin-top:3px;white-space:nowrap}

/* metas */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md);padding:14px 16px;cursor:pointer;text-align:left}
.kpi[aria-pressed="true"]{border-color:var(--verde);box-shadow:inset 0 0 0 1px var(--verde)}
.kpi small{color:var(--mudo);font-size:12px;display:block}
.kpi .v{font:600 26px/1.1 var(--font-mono);margin:6px 0 2px;display:block}
.kpi .d{font-size:11.5px;color:var(--mudo);display:flex;justify-content:space-between;gap:8px;align-items:center}
.grafico{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md);padding:16px 18px;margin-top:14px}
.grafico svg{display:block;width:100%;height:auto}
.fonte{font-size:11.5px;color:var(--mudo)}
.fonte b{color:var(--tinta-2);font-weight:600}

/* financeiro */
.resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.resumo div{padding:12px 14px;border-right:1px solid var(--linha)}
.resumo div:last-child{border-right:0}
.resumo small{display:block;color:var(--mudo);font-size:11.5px}
.resumo b{display:block;font:600 19px/1.3 var(--font-mono);margin-top:3px}
.resumo .d{display:block;color:var(--mudo);font-size:11.5px}
tr.extra td:first-child{box-shadow:inset 3px 0 0 var(--info)}

/* prontuário */
.pr-cab{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.pr-onde{margin:2px 0 0;color:var(--tinta-2)}
.pr-onde .num{color:var(--mudo)}
.gente{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.gente li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-right:1px solid var(--linha);min-width:0}
.gente li:last-child{border-right:0}
.gente small{display:block;color:var(--mudo);font-size:11px}
.gente b{font-weight:600;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gente .avatar{flex:none}
.inds{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;margin-top:14px;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md)}
.ind{padding:12px 12px 10px;border-right:1px solid var(--linha);min-width:0}
.ind:last-child{border-right:0}
.ind small{display:block;color:var(--mudo);font-size:11.5px;white-space:nowrap}
.ind b{display:block;font:600 20px/1.2 var(--font-mono);margin:4px 0 2px}
.ind .d{display:block;color:var(--mudo);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ind svg{display:block;margin-top:6px;width:100%;height:22px}
.caixas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px;margin-top:24px}
.caixa-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--linha);margin-bottom:8px}
.caixa-cab h2{display:flex;align-items:center;gap:8px;font-size:14.5px}
.caixa-cab h2 .ph{color:var(--mudo);font-size:16px}
.caixa-cab svg{width:120px;height:26px;flex:none}
.caixa-cab .ev12{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.caixa-cab .ev12 small{color:var(--mudo);font-size:10.5px}
.linhas{list-style:none;margin:0;padding:0}
.linhas li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--linha)}
.linhas li:last-child{border-bottom:0}
.linhas small{display:block;color:var(--mudo);font-size:11.5px}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin:0;font-size:12.5px}
.dl dt{color:var(--mudo)}.dl dd{margin:0}

/* equipamentos (o pedido da Ana) */
.equip{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;margin-top:12px;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md);overflow:hidden}
.eq-lista{border-right:1px solid var(--linha);max-height:640px;overflow:auto;background:var(--barra)}
.eq-busca{padding:10px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--barra)}
.eq-busca input{width:100%;padding:7px 10px;border-radius:var(--raio-controle);border:1px solid var(--linha-forte);background:var(--superficie);font-size:12.5px}
.eq-grupo{padding:10px 12px 4px;font:600 11px/1 var(--font-sans);color:var(--mudo);text-transform:uppercase;letter-spacing:.05em}
.eq-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:7px 12px;cursor:pointer;font-size:12.5px;color:var(--tinta-2)}
.eq-item:hover{background:var(--superficie)}
.eq-item[aria-current="true"]{background:var(--superficie);color:var(--tinta);box-shadow:inset 3px 0 0 var(--verde)}
.eq-item .num{margin-left:auto;font-size:11px;color:var(--mudo)}
.eq-det{padding:16px 18px;min-width:0}
.eq-blocos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:14px}
.heat{display:grid;gap:2px;margin-top:8px}
.heat .lin{display:grid;grid-template-columns:54px repeat(30,minmax(0,1fr));gap:2px;align-items:center}
.heat .lin span:first-child{font:500 11px/1 var(--font-mono);color:var(--tinta-2)}
.heat i{display:block;height:15px;border-radius:2px}
.heat .eixo span{font:500 9.5px/1 var(--font-mono);color:var(--mudo);text-align:center}
.h-ok{background:#2f8f5b}.h-leve{background:var(--alerta)}.h-severo{background:var(--severo)}.h-parado{background:var(--critico)}.h-sem{background:var(--semcom);opacity:.75}
.achados{list-style:none;margin:12px 0 0;padding:0}
.achados li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--linha);font-size:12.5px}
.achados small{display:block;color:var(--mudo)}

/* recolhíveis */
details.rec{margin-top:26px;border-top:1px solid var(--linha)}
details.rec summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary .ph-caret-down{transition:transform .15s;color:var(--mudo)}
details.rec[open] summary .ph-caret-down{transform:rotate(180deg)}
.comp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.carac{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.carac li{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md);padding:12px 14px;font-size:12.5px}
.carac .cat{font:600 10.5px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mudo)}
.carac p{margin:6px 0}
.carac .afeta{display:flex;flex-wrap:wrap;gap:5px}
.carac .afeta span{font:500 11px/1 var(--font-mono);padding:4px 7px;border-radius:5px;background:var(--superficie-2);border:1px solid var(--linha)}

/* diálogo e aviso */
dialog{width:min(560px,94vw);background:var(--superficie);color:var(--tinta);border:1px solid var(--linha-forte);border-radius:12px;padding:22px}
dialog::backdrop{background:rgba(5,8,16,.65)}
.campo{display:grid;gap:5px;margin-top:12px}
.campo label{font:600 11px/1 var(--font-sans);color:var(--mudo);letter-spacing:.05em;text-transform:uppercase}
.campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border-radius:var(--raio-controle);border:1px solid var(--linha-forte);background:var(--superficie-2)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acoes{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--linha)}
.nota{font-size:12px;color:var(--mudo);margin:10px 0 0}
.nota b{color:var(--tinta-2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--superficie-3);border:1px solid var(--linha-forte);padding:10px 16px;border-radius:var(--raio-controle);font-size:12.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.rodape{margin-top:40px;padding-top:14px;border-top:1px solid var(--linha);color:var(--fraco);font-size:11.5px}

@media (max-width:1180px){.inds{grid-template-columns:repeat(5,minmax(0,1fr))}.ind:nth-child(5){border-right:0}.ind:nth-child(-n+5){border-bottom:1px solid var(--linha)}.gente{grid-template-columns:repeat(3,minmax(0,1fr))}.ficha{grid-template-columns:repeat(3,minmax(0,1fr))}.ficha div:nth-child(3){border-right:0}.ficha div:nth-child(-n+3){border-bottom:1px solid var(--linha)}}
@media (max-width:1100px){.grade2,.caixas,.eq-blocos{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.comp{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.casca{grid-template-columns:minmax(0,1fr)}.menu{display:none}main{padding:16px}.equip{grid-template-columns:minmax(0,1fr)}.eq-lista{max-height:240px;border-right:0;border-bottom:1px solid var(--linha)}.resumo{grid-template-columns:repeat(2,minmax(0,1fr))}.carac{grid-template-columns:minmax(0,1fr)}.gente{grid-template-columns:repeat(2,minmax(0,1fr))}.inds{grid-template-columns:repeat(3,minmax(0,1fr))}.cal .dia{min-height:70px}.ev{font-size:10px}}
/* dentro do Nexus (Contratos e clientes › Prévia, numa moldura): o topo e o menu são os do Nexus; a troca das duas
   visões fica no alto da página */
.troca{display:none;margin:0 0 16px}
html.embutido .topo,html.embutido .menu{display:none}
html.embutido .casca{grid-template-columns:minmax(0,1fr);min-height:0}
html.embutido main{padding:14px 4px 40px;max-width:none}
html.embutido .troca{display:inline-flex}
.troca a{padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--tinta-2);text-decoration:none}
.troca a[aria-current="page"]{background:var(--verde-suave);color:var(--tinta)}
.troca a+a{border-left:1px solid var(--linha-forte)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function heat(id) {
  var semente = id.charCodeAt(4) + id.charCodeAt(5), linhas = "";
  var rnd = function (i, j) { var x = Math.sin(semente * 31 + i * 97 + j * 13) * 10000; return x - Math.floor(x); };
  for (var s = 1; s <= 12; s++) {
    var cel = "";
    for (var d = 0; d < 30; d++) {
      var c = "h-ok";
      if (d === 17) c = "h-sem";                                              // dia sem comunicação (o dado não chegou)
      else if (id === "INV-05" && s === 7) c = d < 9 ? (rnd(s, d) > .6 ? "h-leve" : "h-ok") : d < 22 ? "h-leve" : "h-severo";
      else if (id === "INV-05" && s === 3 && rnd(s, d) > .82) c = "h-leve";
      else if (id === "INV-11" && s === 4) c = d >= 21 ? "h-parado" : "h-ok";
      else if (id === "INV-04" && (s <= 6) && d % 7 > 3 && d < 12) c = "h-leve";
      else if (rnd(s, d) > .975) c = "h-leve";
      cel += '<i class="' + c + '" title="' + "STR-" + String(s).padStart(2, "0") + " · " + (d + 14 > 31 ? (d + 14 - 31) + "/11" : (d + 14) + "/10") + '"></i>';
    }
    linhas += '<div class="lin"><span>STR-' + String(s).padStart(2, "0") + "</span>" + cel + "</div>";
  }
  var eixo = '<div class="lin eixo"><span></span>' + Array.apply(null, Array(30)).map(function (_x, d) { var dia = d + 14 > 31 ? d + 14 - 31 : d + 14; return "<span>" + (d % 5 === 0 ? dia : "") + "</span>"; }).join("") + "</div>";
  return '<div class="heat" role="img" aria-label="Saúde das strings nos últimos 30 dias">' + linhas + eixo + "</div>";
}
function equipamentos() {
  var eq = EQUIP.filter(function (e) { return e.id === estado.equip; })[0] || EQUIP[4], grupos = [];
  EQUIP.forEach(function (e) { if (grupos.indexOf(e.grupo) < 0) grupos.push(e.grupo); });
  var q = estado.buscaEq.toLowerCase();
  var h = '<div class="secao" style="margin-top:30px"><div class="secao-cab"><div><h2>Equipamentos</h2><p class="sub-t">Escolha um equipamento: as OS vinculadas a ele e, para o que gera, o PR e a saúde das strings pelo comportamento dos dias fechados (não é tempo real).</p></div></div>';
  h += '<div class="equip"><div class="eq-lista"><div class="eq-busca"><input type="search" id="buscaEq" placeholder="Procurar o equipamento" value="' + esc(estado.buscaEq) + '" aria-label="Procurar o equipamento"></div>' +
    grupos.map(function (g) {
      var es = EQUIP.filter(function (e) { return e.grupo === g && (!q || e.id.toLowerCase().indexOf(q) >= 0); });
      if (!es.length) return "";
      return '<div class="eq-grupo">' + g + "</div>" + es.map(function (e) {
        var n = (OS_EQ[e.id] || []).filter(function (o) { return !/Concluída/.test(o[2]); }).length;
        return '<button class="eq-item" data-eq="' + esc(e.id) + '" aria-current="' + (e.id === eq.id) + '"><i class="ponto p-' + e.tom + '"></i>' + esc(e.id) + (n ? '<span class="num">' + n + " OS</span>" : "") + "</button>";
      }).join("");
    }).join("") + "</div>";
  var oss = OS_EQ[eq.id] || [];
  h += '<div class="eq-det"><div class="marco-cab"><div><p class="eyebrow" style="color:var(--mudo)">' + esc(eq.grupo) + "</p><h2 style=\"font-size:18px;margin-top:4px\">" + esc(eq.id) + "</h2></div>" +
    '<span class="pill t-' + (eq.tom === "ok" ? "ok" : eq.tom) + '">' + (eq.tom === "ok" ? "normal" : eq.tom === "alerta" ? "atenção" : "severo") + "</span></div>" +
    '<dl class="dl" style="margin-top:10px">' + eq.ficha.map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + esc(f[1]) + "</dd>"; }).join("") + "</dl>";
  h += '<div class="eq-blocos"><div><h3>OS vinculadas</h3>' + (oss.length ? '<ul class="achados">' + oss.map(function (o) {
    return '<li><span class="pill ' + o[3] + '">' + o[0] + "</span><span>" + esc(o[1]) + "<small>" + esc(o[2]) + "</small></span></li>";
  }).join("") + "</ul>" : '<p class="nota">Nenhuma OS vinculada a este equipamento nos últimos 12 meses.</p>') + "</div>";
  if (eq.gera) {
    var base = eq.id === "INV-05" ? [80.4, 79.6, 77.8, 80.9, 81.2, 80.5, 79.9, 79.0, 77.1, 76.8, 77.0, 75.9] : eq.id === "INV-11" ? [80.1, 79.3, 77.5, 80.6, 81.0, 80.8, 80.2, 79.6, 78.4, 78.7, 77.2, 76.4] : [80.0, 79.2, 77.4, 80.5, 81.1, 80.4, 80.1, 79.4, 78.0, 78.4, 79.6, 79.3];
    h += '<div><h3>PR do inversor · 12 meses</h3><div style="margin-top:10px">' + spark(base, 78, true, 300, 70) + '</div><p class="nota">Último mês: <b>' + pct(base[11]) + "%</b> · usina " + pct(78.9) + "% · linha tracejada: o previsto (78%).</p></div></div>";
    h += '<div style="margin-top:18px"><div class="marco-cab"><h3>Saúde das strings · últimos 30 dias fechados</h3><div class="legenda"><span><i class="ponto" style="background:#2f8f5b"></i>normal</span><span><i class="ponto p-alerta"></i>leve (85 a 95%)</span><span><i class="ponto p-severo"></i>severa (60 a 85%)</span><span><i class="ponto p-critico"></i>parada</span><span><i class="ponto p-semcom"></i>sem dado</span></div></div>' + heat(eq.id);
    var ach = eq.id === "INV-05" ? [["alerta", "STR-07 abaixo da média em 21 dos 30 dias", "14% abaixo da mediana do inversor, piorando desde 23/10; casa com a falha de isolamento da OS 18540"], ["ok", "STR-03 oscila em dias nublados", "dentro do normal; nenhuma ação"]]
      : eq.id === "INV-11" ? [["critico", "STR-04 sem corrente desde 04/11", "9 dias parada · OS 18533 aguardando o fusível"]]
      : eq.id === "INV-04" ? [["alerta", "STR-01 a STR-06 caem no fim da tarde em parte dos dias", "padrão de sombra: ver a característica \"Árvores na divisa leste\""]]
      : [["ok", "Todas as strings dentro do comportamento normal", "nenhuma abaixo da mediana do inversor de forma repetida"]];
    h += '<ul class="achados">' + ach.map(function (a) { return '<li><i class="ponto p-' + a[0] + '" style="margin-top:5px"></i><span><b>' + esc(a[1]) + "</b><small>" + esc(a[2]) + "</small></span></li>"; }).join("") +
      '</ul><p class="nota">A cor de cada dia é a corrente da string sobre a mediana das strings do mesmo inversor, no dia fechado. O dia 31/10 ficou sem dado para todas (falha de comunicação), e não conta como parada.</p></div>';
  } else {
    h += '<div><h3>Comportamento</h3><p class="nota">' + (eq.grupo === "Trackers" ? (eq.id === "TRK Bloco B" ? "<b>3 trackers</b> fora de posição em 4 dias do mês (TCU B-07, B-14, B-22). A inspeção trimestral do bloco está atrasada." : "Nenhum tracker fora de posição de forma repetida no mês.") : "Este equipamento não gera: sem PR nem strings. Aparecem as OS e a ficha.") + "</p></div></div>";
  }
  return h + "</div></div></div>";
}
function composicao() {
  var col = function (t, l) { return "<div><h3 style=\"margin-bottom:8px\">" + t + '</h3><dl class="dl">' + l.map(function (x) { return "<dt>" + x[0] + "</dt><dd>" + x[1] + "</dd>"; }).join("") + "</dl></div>"; };
  return '<div class="comp" style="padding-bottom:10px">' +
    col("Identificação", [["Código", '<span class="num">SAZ200</span>'], ["Cliente", "Solar Horizonte Energia S.A."], ["Contrato", '<span class="num">CT-2025-014</span>'], ["Entrada em operação", "15/06/2023"], ["Local", "Pirapora/MG · zona rural"], ["Coordenadas", '<span class="num">-17,3521 · -44,9412</span>']]) +
    col("Potência e quantidades", [["Potência", '<span class="num">4,50 MWp CC · 3,75 MW CA</span>'], ["Inversores", '<span class="num">15</span>'], ["Módulos", '<span class="num">8.184</span>'], ["Trackers", '<span class="num">136</span> em 4 blocos'], ["Strings", '<span class="num">360</span>'], ["Transformadores", '<span class="num">2</span> (SKID 1 e 2)']]) +
    col("Fabricantes", [["Módulos", "Jinko Solar Tiger Neo 550 W"], ["Inversores", "Sungrow SG250HX"], ["Trackers", "Nextracker NX Horizon"], ["Subestação", "Sungrow MVS2000"], ["Estação", "Kipp & Zonen"], ["Medidor", "Landis+Gyr E650"]]) + "</div>";
}
function caracteristicas() {
  return '<div class="faixa" style="margin-bottom:12px;justify-content:space-between"><span class="sub-t">' + CARAC.length + ' características cadastradas</span><button class="btn btn--prim" data-nova-carac><i class="ph ph-plus"></i>Adicionar característica</button></div>' +
    '<ul class="carac">' + CARAC.map(function (c) {
      return '<li><span class="cat">' + esc(c.cat) + "</span><p>" + esc(c.txt) + '</p><div class="afeta">' + c.afeta.map(function (a) { return "<span>" + esc(a) + "</span>"; }).join("") +
        '</div><span class="quem" style="margin-top:8px">' + esc(c.quem) + " · " + esc(c.setor) + " · " + esc(c.quando) + "</span></li>";
    }).join("") + "</ul>";
}

/* ── os diálogos ─────────────────────────────────────────────────────────────────────────────────────────────── */
var dlg = document.getElementById("dlg");
function abrirDlg(html) { dlg.innerHTML = html; dlg.showModal(); var f = dlg.querySelector("input,select,textarea"); if (f) f.focus(); }
function rodapeDlg(rot) { return '<p class="nota">Fica registrado: <b>' + EU + "</b>, " + agoraTxt() + '.</p><div class="acoes"><button class="btn btn--prim" data-salvar>' + rot + '</button><button class="btn" data-fechar>Cancelar</button></div>'; }
function dlgRegra(i) {
  var r = i == null ? null : REGRAS[i];
  abrirDlg('<p class="eyebrow">Regras do contrato</p><h2 id="dlg-t" style="margin-top:6px;font-size:19px">' + (r ? "Ajustar: " + esc(r.nome) : "Nova regra acordada") + "</h2>" +
    (r ? '<p class="nota">Contratual: <b>' + esc(r.contratual || "não está no contrato") + "</b>" + (r.acordada ? " · acordada hoje: <b>" + esc(r.acordada) + "</b>" : "") + "</p>" : "") +
    (r ? "" : '<div class="dupla"><div class="campo"><label for="f-cat">Categoria</label><select id="f-cat">' + CATS.map(function (c) { return "<option>" + c + "</option>"; }).join("") + '</select></div><div class="campo"><label for="f-setor">Setor responsável</label><select id="f-setor"><option>Contratos</option><option>COS</option><option>Engenharia de O&M</option><option>Performance</option><option>PCM</option><option>Supervisão de Campo</option><option>Zeladoria</option></select></div></div><div class="campo"><label for="f-nome">Regra</label><input id="f-nome" placeholder="Ex.: Relatório de chuvas depois de evento extremo"></div>') +
    '<div class="campo"><label for="f-val">Como fica a regra</label><textarea id="f-val" rows="2" placeholder="Ex.: Até o 6º dia útil do mês seguinte">' + (r && r.acordada ? esc(r.acordada) : "") + "</textarea></div>" +
    '<div class="dupla"><div class="campo"><label for="f-orig">Origem</label><select id="f-orig"><option>Ata de reunião</option><option>E-mail do cliente</option><option>Aditivo</option><option>Ofício</option></select></div><div class="campo"><label for="f-desde">Vale a partir de</label><input id="f-desde" type="date" value="2026-11-13"></div></div>' +
    '<div class="campo"><label for="f-mot">Motivo</label><input id="f-mot" placeholder="Por que mudou"></div>' + rodapeDlg(r ? "Salvar o ajuste" : "Cadastrar a regra"));
  dlg.querySelector("[data-salvar]").onclick = function () {
    var val = dlg.querySelector("#f-val").value.trim(), orig = dlg.querySelector("#f-orig").value, mot = dlg.querySelector("#f-mot").value.trim() || "Sem motivo escrito.";
    if (!val) { toast("Escreva como fica a regra."); return; }
    if (r) {
      r.hist.unshift({quem: EU, setor: "Contratos", quando: agoraTxt(), de: (r.acordada || r.contratual || "Não estava no contrato") + (r.acordada ? "" : " (contratual)"), para: val, origem: orig, motivo: mot});
      r.acordada = val; estado.abertoHist[i] = true;
    } else {
      var nome = dlg.querySelector("#f-nome").value.trim() || "Regra nova";
      REGRAS.push({cat: dlg.querySelector("#f-cat").value, nome: nome, setor: dlg.querySelector("#f-setor").value, cl: "", contratual: "", acordada: val,
                   hist: [{quem: EU, setor: "Contratos", quando: agoraTxt(), de: "Não estava no contrato", para: val, origem: orig, motivo: mot}]});
      estado.filtroCat = "";
    }
    dlg.close(); render(); toast(r ? "Regra ajustada: a acordada passa a valer e a anterior fica no histórico." : "Regra cadastrada: vale a partir de hoje.");
  };
}
function dlgEntrada() {
  abrirDlg('<p class="eyebrow">BM e financeiro</p><h2 id="dlg-t" style="margin-top:6px;font-size:19px">Nova entrada</h2><p class="nota">Para o que entra além do previsto no contrato: hora extra, serviço extra, aditivo.</p>' +
    '<div class="campo"><label for="f-ref">Referente a</label><input id="f-ref" placeholder="Ex.: Lavagem extra de módulos da UFV Serra Azul 1"></div>' +
    '<div class="dupla"><div class="campo"><label for="f-vl">Valor (R$)</label><input id="f-vl" inputmode="decimal" placeholder="0,00"></div><div class="campo"><label for="f-comp">Competência</label><select id="f-comp">' + MESES.map(function (m, i) { return '<option value="' + i + '"' + (i === 11 ? " selected" : "") + ">" + m + "/26</option>"; }).join("") + "</select></div></div>" +
    '<div class="campo"><label for="f-med">Previsão de medição</label><input id="f-med" type="date" value="2027-01-11"></div>' + rodapeDlg("Cadastrar a entrada"));
  dlg.querySelector("[data-salvar]").onclick = function () {
    var ref = dlg.querySelector("#f-ref").value.trim(), vl = parseFloat((dlg.querySelector("#f-vl").value || "0").replace(/\./g, "").replace(",", "."));
    if (!ref || !(vl > 0)) { toast("Diga a que a entrada se refere e o valor."); return; }
    var dt = dlg.querySelector("#f-med").value.split("-");
    FIN.push({comp: +dlg.querySelector("#f-comp").value, ref: ref, valor: vl, med: dt[2] + "/" + dt[1] + "/" + dt[0], st: "futura", extra: true, quem: EU + " · 13/11/2026", nota: ""});
    dlg.close(); render(); toast("Entrada cadastrada como lançamento futuro.");
  };
}
function dlgCarac() {
  abrirDlg('<p class="eyebrow">Prontuário da usina</p><h2 id="dlg-t" style="margin-top:6px;font-size:19px">Adicionar característica</h2>' +
    '<div class="campo"><label for="f-cc">Tipo</label><select id="f-cc"><option>Ambiente</option><option>Terreno</option><option>Clima e acesso</option><option>Medição</option><option>Equipamento</option><option>Outra</option></select></div>' +
    '<div class="campo"><label for="f-ct">O que se observou</label><textarea id="f-ct" rows="3" placeholder="Ex.: Presença de árvores externas afetando o INV-08 no fim da tarde"></textarea></div>' +
    '<div class="campo"><label for="f-ca">Equipamentos afetados (opcional)</label><input id="f-ca" placeholder="Ex.: INV-08, strings 3 e 4"></div>' + rodapeDlg("Adicionar"));
  dlg.querySelector("[data-salvar]").onclick = function () {

    dlg.close(); render(); toast("Característica adicionada ao prontuário.");

}
dlg.addEventListener("click", function (e) { if (e.target.closest("[data-fechar]")) dlg.close(); });

/* ── rotas e eventos ─────────────────────────────────────────────────────────────────────────────────────────── */
var main = document.getElementById("main");
function render() {
  var r = (location.hash || "#/contrato/regras").replace("#/", "").split("/");
  var pagina = r[0] === "prontuario" ? "prontuario" : "contrato";
  if (pagina === "contrato") estado.abaCt = ABAS_CT.some(function (a) { return a[0] === r[1]; }) ? r[1] : "regras";
  document.querySelectorAll("[data-menu]").forEach(function (a) { if (a.getAttribute("data-menu") === pagina) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.title = (pagina === "prontuario" ? "Prontuário da usina" : "Visão do contrato") + " · Nexus";
  main.innerHTML = '<nav class="troca seg" aria-label="Visões"><a href="#/contrato/regras"' + (pagina === "contrato" ? ' aria-current="page"' : "") +
    '>Visão do contrato</a><a href="#/prontuario"' + (pagina === "prontuario" ? ' aria-current="page"' : "") + ">Prontuário da usina</a></nav>" +
    (pagina === "prontuario" ? vProntuario() : vContrato()) +
    '<p class="rodape">Mockup para avaliação · dados ilustrativos (cliente, CNPJ, pessoas e usinas fictícios) · "hoje" = 13/11/2026 · nada aqui grava.</p>';
}
var ultimaRota = "";
window.addEventListener("hashchange", function () { var rota = location.hash.split("/")[1]; render(); if (rota !== ultimaRota) window.scrollTo(0, 0); ultimaRota = rota; });
main.addEventListener("click", function (e) {
  var b;
  if ((b = e.target.closest("[data-cat]"))) { estado.filtroCat = b.getAttribute("data-cat"); render(); }
  else if ((b = e.target.closest("[data-hist]"))) { var i = b.getAttribute("data-hist"); estado.abertoHist[i] = !estado.abertoHist[i]; render(); }
  else if ((b = e.target.closest("[data-ajustar]"))) dlgRegra(+b.getAttribute("data-ajustar"));
  else if (e.target.closest("[data-nova-regra]")) dlgRegra(null);
  else if ((b = e.target.closest("[data-freq]"))) { estado.freq = b.getAttribute("data-freq"); render(); }
  else if ((b = e.target.closest("[data-at]"))) { estado.atModo = b.getAttribute("data-at"); render(); }
  else if ((b = e.target.closest("[data-ent]"))) { estado.entModo = b.getAttribute("data-ent"); render(); }
  else if ((b = e.target.closest("[data-kpi]"))) { estado.kpi = b.getAttribute("data-kpi"); render(); }
  else if ((b = e.target.closest("[data-agrup]"))) { estado.agrup = b.getAttribute("data-agrup"); render(); }
  else if (e.target.closest("[data-nova-entrada]")) dlgEntrada();
  else if ((b = e.target.closest("[data-eq]"))) { estado.equip = b.getAttribute("data-eq"); render(); document.querySelector(".equip").scrollIntoView({block: "nearest"}); }
  else if ((b = e.target.closest("[data-evol]"))) { estado.evol = b.getAttribute("data-evol") === "1"; render(); }
  else if (e.target.closest("[data-nova-carac]")) dlgCarac();
});
main.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "selCt" && t.value !== "0") { t.value = "0"; toast("No mockup só o contrato CT-2025-014 tem dados."); }
  else if (t.id === "selMes") { estado.mesPr = +t.value; render(); }
  else if (t.hasAttribute("data-marco")) {
    var m = MARCOS[+t.getAttribute("data-marco")]; m.u[t.getAttribute("data-u")] = t.checked;
    CARIMBO[m.nome] = EU + " · " + agoraTxt().slice(0, 5) + " " + agoraTxt().slice(11); render();
    toast(t.checked ? "Marcado como concluído no mês, com o seu nome e a hora." : "Desmarcado; o registro fica no histórico.");
  } else if (t.hasAttribute("data-marco-todo")) {
    var mm = MARCOS[+t.getAttribute("data-marco-todo")];
    Object.keys(mm.u).forEach(function (k) { if (mm.u[k] !== null) mm.u[k] = t.checked; });
    CARIMBO[mm.nome] = EU + " · " + agoraTxt().slice(0, 5) + " " + agoraTxt().slice(11) + " · contrato inteiro"; render();
    toast(t.checked ? "Concluído em todas as usinas do contrato." : "Desmarcado em todas as usinas.");
  }
});
main.addEventListener("input", function (e) {
  if (e.target.id === "buscaEq") {
    estado.buscaEq = e.target.value; var pos = e.target.selectionStart; render();
    var i = document.getElementById("buscaEq"); i.focus(); i.setSelectionRange(pos, pos);
  }
});
render();
</script>
