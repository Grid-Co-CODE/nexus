<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visão do contrato · Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* Mockup da Visão do contrato (pedido da área de Contratos, 12/11/2026), para a avaliação de Contratos e dos setores. Tokens do
   nexus.css (tema escuro navy, verde Grid). Dados ilustrativos: cliente, CNPJ, pessoas e usinas são fictícios.

   Enxuta desde 12/11/2026 à noite (Levi: "É quase a tela inteira, só de nada com nada [...] A gente está vendo o quê?
   Regras do contrato. Então, tem que mostrar regras do contrato. Aí tem um filtro para isso, um filtro para aquilo. Aí
   uma porrada de KPI. Aí tem outro filtro lá em cima de contrato. Aí tem um botão de nova regra. Se decida, enxugue";
   o Prontuário da usina saiu: "não tem nada a ver"). A regra que ficou, para toda aba:
   - o contrato em DUAS linhas (o nome, que é também a troca de contrato, e uma linha de fatos); a ficha inteira só no
     clique em "Dados do contrato";
   - a aba não repete o título nem explica a si mesma: abre no conteúdo;
   - no máximo UM controle por aba, e só quando muda o que se vê (Todas | Acordadas; Por usina | Por cliente);
   - o que acrescenta (regra nova, entrada nova) é a última linha da tabela, não um botão no alto;
   - um nível de superfície: a tabela é a única caixa.

   3ª rodada, na mesma noite (Levi: "esse scroll branco aí é zoado [...] deixa no estilo Nexus. E todas essas regras aí,
   deixa recolhido [...] eu quero ver entregáveis, quero ver SLA, a pessoa vai clicando [...] seria bom se fosse separado
   para o cliente [...] E aí seria bom para os gestores de contrato [...] recebendo as notificações [...] tem tantos em
   atraso, isso está sempre para ele [...] Sempre"):
   - a barra de rolagem é a do Nexus (fina e escura), e os controles do navegador vêm no escuro (color-scheme);
   - as Regras abrem RECOLHIDAS: uma linha por categoria, com quantas regras e quantas acordadas; o clique abre;
   - o que está em atraso fica numa linha no cabeçalho do contrato, em TODA aba, com o aviso de que o gestor recebe a
     notificação no sino do Nexus enquanto houver atraso;
   - cada cliente tem o contrato dele: o nome no alto troca o contrato (no mockup só o primeiro tem dados);
   - o gestor do contrato aparece QUANDO o contrato tem um (Levi: "Caso tenha gestor do contrato, também quero que
     apareça"): na 1ª linha do cabeçalho, ao lado do código e do tipo, no aviso de atraso (é no sino dele que o aviso
     cai) e na coluna do Atendimento por cliente. Contrato sem gestor não mostra o campo vazio: a 1ª linha fica sem ele,
     o aviso de atraso diz que vai para o setor Contratos e a tabela diz "sem gestor". */
:root{
  --fundo:#090d18;--superficie:#161d30;--superficie-2:#1c2640;--superficie-3:#243154;--barra:#0d1526;
  --tinta:#e9eef6;--tinta-2:#c3cad7;--mudo:#96a0b4;--fraco:#767d92;
  --linha:rgba(255,255,255,.09);--linha-forte:rgba(255,255,255,.16);
  --verde:#a3d900;--verde-suave:rgba(163,217,0,.12);--verde-texto:#c4e755;--sobre-verde:#10170a;
  --ok:#4ade80;--ok-suave:rgba(74,222,128,.14);--alerta:#ffd83d;--alerta-suave:rgba(255,216,61,.14);
  --severo:#ff8f3c;--severo-suave:rgba(255,143,60,.15);--critico:#ff5b6e;--critico-suave:rgba(255,91,110,.14);
  --info:#7fb8ff;--info-suave:rgba(91,157,255,.14);
  --font-sans:"Poppins",system-ui,sans-serif;--font-mono:"IBM Plex Mono",Consolas,monospace;
  --raio-tag:6px;--raio-controle:8px;--raio-md:10px;--rolagem:#243154;--rolagem-hover:#34426b;
}
/* a barra de rolagem do Nexus (a mesma do nexus.css): a padrão do navegador, clara e com setas, destoava do navy dentro
   da moldura (Levi, 12/11/2026: "esse scroll branco aí é zoado") */
html{color-scheme:dark;scrollbar-width:thin;scrollbar-color:var(--rolagem) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rolagem);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--rolagem-hover)}
::-webkit-scrollbar-button{display:none}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 13.5px/1.5 var(--font-sans)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde-texto)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.mudo{color:var(--mudo)}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

/* a casca só existe fora do Nexus (tela cheia): dentro da moldura o topo é o do Nexus */
.topo{display:flex;align-items:center;gap:14px;height:52px;padding:0 24px;background:var(--barra);border-bottom:1px solid var(--linha)}
.marca{font:700 16px/1 var(--font-sans);letter-spacing:-.01em}.marca b{color:var(--verde)}
.marca span{margin-left:12px;padding-left:12px;border-left:1px solid var(--linha-forte);font-weight:600}
.selo-mock{margin-left:auto;font:500 11.5px/1 var(--font-sans);color:var(--mudo)}
main{padding:20px 24px 56px;max-width:1240px;margin:0 auto}
html.embutido .topo{display:none}
html.embutido main{padding:16px 2px 40px;max-width:none}

/* o contrato em duas linhas */
.ct-linha{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.ct-nome{position:relative;display:inline-flex;align-items:center;max-width:100%}
.ct-nome select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 26px 0 0;margin:0;cursor:pointer;
  font:700 22px/1.25 var(--font-sans);letter-spacing:-.02em;color:var(--tinta);max-width:100%;text-overflow:ellipsis;border-radius:6px;field-sizing:content}
.ct-nome select option{font:400 14px var(--font-sans);background:var(--superficie);color:var(--tinta)}
.ct-nome .ph{position:absolute;right:4px;top:50%;margin-top:-8px;font-size:16px;color:var(--mudo);pointer-events:none}
.ct-cod{color:var(--tinta-2);font-size:13px}
.ct-tipo{color:var(--mudo);font-size:13px}
/* o gestor do contrato, quando há: na 1ª linha, à vista sem abrir a ficha */
.ct-gestor{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--tinta)}
.ct-gestor small{font-weight:400;font-size:12px;color:var(--mudo)}
.ct-gestor .ph{font-size:16px;color:var(--verde-texto)}
.ct-mais{margin-left:auto}
.fatos{display:flex;flex-wrap:wrap;gap:4px 30px;margin:8px 0 0;padding:0}
.fatos div{display:flex;align-items:baseline;gap:8px;min-width:0}
.fatos dt{color:var(--mudo);font-size:12px}
.fatos dd{margin:0;font-weight:500;color:var(--tinta)}
.fatos dd small{font-weight:400;color:var(--mudo);font-size:12px;margin-left:6px}
.ficha{margin:14px 0 0;padding:14px 0 2px;border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 32px}
.ficha dt{color:var(--mudo);font-size:11.5px}
.ficha dd{margin:1px 0 0;color:var(--tinta-2)}
.ficha dd b{color:var(--tinta);font-weight:600}
.ficha .larga{grid-column:1 / -1}
.usinas{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0;padding:0}
.usinas li{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--linha);color:var(--tinta-2)}
.usinas .num{color:var(--mudo);margin-left:5px}

/* o que está em atraso: uma linha no cabeçalho do contrato, em toda aba (o gestor sempre vê) */
.atraso{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin:12px 0 0;padding:8px 12px;border-radius:var(--raio-controle);background:var(--critico-suave);font-size:12.5px}
.atraso b{color:var(--critico);white-space:nowrap}
.atraso-sino{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--tinta-2);font-size:12px}
.vazio{margin:28px 0 0;max-width:62ch}
.vazio p{color:var(--tinta-2);margin:8px 0 16px}

/* as abas: presas no alto enquanto a tabela rola */
.abas{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--linha);overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--fundo)}
.abas a{padding:10px 14px;color:var(--mudo);text-decoration:none;font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.abas a:hover{color:var(--tinta)}
.abas a[aria-current="page"]{color:var(--tinta);border-color:var(--verde)}
.abas a b{margin-left:7px;font:600 11px/1 var(--font-mono);color:var(--critico)}

/* a régua de cada aba: o período ou a contagem à esquerda, o único controle à direita */
.regua{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin:16px 0 12px;min-height:32px}
h2{margin:0;font:600 15px/1.3 var(--font-sans)}
h3{margin:0;font:600 13.5px/1.3 var(--font-sans)}
.seg{display:inline-flex;border:1px solid var(--linha-forte);border-radius:var(--raio-controle);overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--tinta-2)}
.seg button b{margin-left:6px;font:500 11.5px/1 var(--font-mono);color:var(--mudo)}
.seg button[aria-pressed="true"]{background:var(--verde-suave);color:var(--tinta)}
.seg button[aria-pressed="true"] b{color:var(--verde-texto)}
.seg button+button{border-left:1px solid var(--linha-forte)}
.linkbtn{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--verde-texto);cursor:pointer;font-size:12.5px;font-weight:600}
.linkbtn:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:var(--raio-controle);border:1px solid var(--linha-forte);background:transparent;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--superficie-2)}
.btn--prim{background:var(--verde);border-color:var(--verde);color:var(--sobre-verde)}
.btn--prim:hover{background:#8bbf00}
.nota{font-size:12px;color:var(--mudo);margin:10px 0 0;max-width:86ch}
.nota b{color:var(--tinta-2)}
.bloco{margin-top:26px}
.bloco > h3{margin-bottom:10px}

/* a tabela (a única superfície) */
.rolavel{overflow-x:auto;border-radius:var(--raio-md)}
.tab{width:100%;border-collapse:collapse;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md);overflow:hidden;font-size:13px}
.tab th{text-align:left;font:500 11.5px/1.2 var(--font-sans);color:var(--mudo);padding:9px 14px;border-bottom:1px solid var(--linha);background:var(--barra);white-space:nowrap}
.tab td{padding:11px 14px;border-bottom:1px solid var(--linha);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.tab td.c,.tab th.c{text-align:center}
.tab td.r,.tab th.r{text-align:right}
.tab tr.grupo td{padding:0;background:var(--barra)}
.tab tr.grupo button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:13px 14px;cursor:pointer;text-align:left;font:600 13.5px/1.2 var(--font-sans);color:var(--tinta)}
.tab tr.grupo button:hover{background:var(--superficie-2)}
.tab tr.grupo button .ph{color:var(--mudo);font-size:14px}
.tab tr.grupo .g-n{margin-left:auto;font:400 12px/1 var(--font-sans);color:var(--mudo)}
.tab tr.mais td{padding:0}
.tab tr.mais button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:12px 14px;cursor:pointer;color:var(--mudo);font-size:12.5px;font-weight:600;text-align:left}
.tab tr.mais button:hover{color:var(--verde-texto);background:var(--superficie-2)}
.nome{font-weight:600}
.sub{display:block;color:var(--mudo);font-size:11.5px;margin-top:2px}
.antes{display:block;color:var(--mudo);font-size:12px;margin-top:3px}
.antes s{color:var(--fraco);text-decoration-color:rgba(255,255,255,.3)}
.vazio-c{color:var(--fraco)}
.hist{list-style:none;margin:0;padding:2px 0 2px 14px;border-left:2px solid var(--linha-forte);font-size:12.5px;display:grid;gap:10px}
.hist li span{display:block;color:var(--tinta-2);margin-top:2px}
tr.hist-l td{background:var(--barra)}

/* selos */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/16px var(--font-sans);padding:2px 8px;border-radius:var(--raio-tag);white-space:nowrap;vertical-align:1px}
.t-ok{color:var(--ok);background:var(--ok-suave)}.t-alerta{color:var(--alerta);background:var(--alerta-suave)}
.t-severo{color:var(--severo);background:var(--severo-suave)}.t-info{color:var(--info);background:var(--info-suave)}
.t-neutro{color:var(--mudo);background:var(--superficie-2)}.t-verde{color:var(--verde-texto);background:var(--verde-suave)}
.c-ok{color:var(--ok)}.c-alerta{color:var(--alerta)}.c-critico{color:var(--critico)}
.ponto{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:1px}
.p-ok{background:var(--ok)}.p-alerta{background:var(--alerta)}.p-critico{background:var(--critico)}.p-severo{background:var(--severo)}
.p-neutro{background:var(--superficie-3);box-shadow:inset 0 0 0 1px var(--linha-forte)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mudo)}
.legenda span{display:inline-flex;align-items:center;gap:6px}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--linha);border-radius:var(--raio-md);overflow:hidden;background:var(--superficie)}
.cal .dsem{padding:8px 10px;font:500 11.5px/1 var(--font-sans);color:var(--mudo);background:var(--barra);border-bottom:1px solid var(--linha)}
.cal .dia{min-height:96px;padding:7px 7px 8px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .dia:nth-child(7n){border-right:0}
.cal .dia.fora{background:rgba(0,0,0,.18)}
.cal .dia.hoje{box-shadow:inset 0 0 0 1px var(--verde)}
.cal .n{font:600 12px/1 var(--font-mono);color:var(--tinta-2);margin-bottom:2px}
.cal .dia.hoje .n{color:var(--verde-texto)}
.cal .fer{font-size:10.5px;color:var(--mudo)}
.ev{display:block;font-size:11px;line-height:1.3;padding:3px 6px;border-radius:5px;border-left:3px solid;background:var(--superficie-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.ok{border-color:var(--ok)}.ev.alerta{border-color:var(--alerta)}.ev.critico{border-color:var(--critico)}.ev.neutro{border-color:var(--superficie-3);color:var(--tinta-2)}
.grade2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.lista-lat h3{margin-bottom:8px}
.lista-lat ul{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--linha)}
.lista-lat li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--linha);font-size:12.5px}
.lista-lat li .ponto{margin-top:5px}
.lista-lat small{display:block;color:var(--mudo)}
.ano td,.ano th{text-align:center;padding:7px 4px}
.ano td:first-child,.ano th:first-child{text-align:left;white-space:nowrap;padding-left:14px}
.cel{display:inline-block;width:100%;max-width:38px;height:14px;border-radius:4px}

/* entregáveis */
.barra-prog{height:6px;border-radius:999px;background:var(--superficie-3);overflow:hidden;width:120px}
.barra-prog i{display:block;height:100%;background:var(--ok)}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px}
.check input{width:16px;height:16px;accent-color:var(--verde);cursor:pointer}
.carimbo{display:block;color:var(--mudo);font-size:11.5px;margin-top:3px;white-space:nowrap}

/* metas */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-md);overflow:hidden}
.kpi{border:0;border-right:1px solid var(--linha);background:transparent;padding:12px 14px 10px;cursor:pointer;text-align:left;min-width:0}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--superficie-2)}
.kpi[aria-pressed="true"]{box-shadow:inset 0 -2px 0 var(--verde);background:var(--superficie-2)}
.kpi small{color:var(--mudo);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:600 22px/1.15 var(--font-mono);margin:5px 0 1px;display:block}
.kpi .d{font-size:11.5px;color:var(--mudo);display:block}
.kpi svg{display:block;width:100%;height:22px;margin-top:6px}
.grafico{margin-top:16px}
.grafico-cab{display:flex;justify-content:space-between;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
/* o gráfico para em 860 px: esticado na tela larga, as barras e os números dobravam de tamanho */
.grafico svg{display:block;width:100%;max-width:860px;height:auto}
.fonte{font-size:11.5px;color:var(--mudo)}

/* financeiro */
.resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.resumo div{padding:12px 16px;border-right:1px solid var(--linha)}
.resumo div:first-child{padding-left:0}
.resumo div:last-child{border-right:0}
.resumo dt{color:var(--mudo);font-size:11.5px}
.resumo dd{margin:3px 0 0;font:600 18px/1.3 var(--font-mono)}
.resumo dd small{display:block;font:400 11.5px/1.4 var(--font-sans);color:var(--mudo)}
tr.extra td:first-child{box-shadow:inset 3px 0 0 var(--info)}

/* diálogo e aviso */
dialog{width:min(540px,94vw);background:var(--superficie);color:var(--tinta);border:1px solid var(--linha-forte);border-radius:12px;padding:22px}
dialog::backdrop{background:rgba(5,8,16,.65)}
dialog h2{font-size:17px}
.campo{display:grid;gap:5px;margin-top:12px}
.campo label{font:500 12px/1 var(--font-sans);color:var(--mudo)}
.campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border-radius:var(--raio-controle);border:1px solid var(--linha-forte);background:var(--superficie-2)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acoes{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--linha)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--superficie-3);border:1px solid var(--linha-forte);padding:10px 16px;border-radius:var(--raio-controle);font-size:12.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.rodape{margin-top:36px;color:var(--fraco);font-size:11.5px}

@media (max-width:1100px){.grade2{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(3){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--linha)}.ficha{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){main{padding:14px 16px 40px}.resumo{grid-template-columns:repeat(2,minmax(0,1fr))}.resumo div:nth-child(2){border-right:0}.resumo div:nth-child(3){padding-left:0}.cal .dia{min-height:64px}.ev{font-size:10px}.ct-mais{margin-left:0}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-bottom:1px solid var(--linha)}.kpi:nth-child(3){border-right:1px solid var(--linha)}.kpi:nth-child(2n){border-right:0}.ficha{grid-template-columns:minmax(0,1fr)}.ct-nome select{font-size:18px}.dupla{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topo">
  <div class="marca"><b>Grid</b> Co.<span>Nexus</span></div>
  <span class="selo-mock">Mockup, dados ilustrativos</span>
</header>

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }

function seg(rotulo, atributo, atual, opcoes) {

  }).join("") + "</span>";
}
function tomCal(e) {
  if (e.ent) return "ok";
  var dias = Math.round((new Date(2026, 10, e.d) - HOJE) / 864e5);
  if (dias < 0) return "critico";
  return dias <= 7 ? "alerta" : "neutro";
}
// a linha de tendência curta (12 meses): a cor do último ponto diz se está na meta
function spark(h, meta, w, hh) {
  var min = Math.min.apply(null, h.concat([meta])), max = Math.max.apply(null, h.concat([meta]));
  if (max === min) { max += 1; min -= 1; }
  var px = function (i) { return 2 + i * (w - 4) / (h.length - 1); }, py = function (v) { return hh - 3 - (v - min) * (hh - 6) / (max - min); };
  var ult = h[h.length - 1];
  return '<svg viewBox="0 0 ' + w + " " + hh + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<line x1="0" x2="' + w + '" y1="' + py(meta).toFixed(1) + '" y2="' + py(meta).toFixed(1) + '" stroke="rgba(255,255,255,.22)" stroke-dasharray="3 3"/>' +
    '<polyline points="' + h.map(function (v, i) { return px(i).toFixed(1) + "," + py(v).toFixed(1); }).join(" ") + '" fill="none" stroke="#96a0b4" stroke-width="1.5" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + px(h.length - 1).toFixed(1) + '" cy="' + py(ult).toFixed(1) + '" r="2.6" fill="' + (ult >= meta ? "#4ade80" : "#ff5b6e") + '"/></svg>';
}

    return h + '<div class="vazio"><h2>O mockup só tem os dados da ' + esc(CONTRATOS[0].cliente) + '</h2><p>Na tela de verdade cada cliente abre o contrato dele: as regras, o calendário, o atendimento, os entregáveis, as metas e o financeiro são separados por contrato, e o que se acorda com um não muda o do outro.</p>' +
      '<button class="btn" data-voltar-ct>Voltar para a ' + esc(CONTRATOS[0].cliente) + "</button></div>";
  }
  h += '<dl class="fatos"><div><dt>Vigência</dt><dd>até 28/02/2028<small>faltam 15 meses</small></dd></div>' +

  }

      (a[0] === "calendario" && atrasadas ? '<b title="' + atrasadas + ' atrasadas">' + atrasadas + "</b>" : "") + "</a>";
  }).join("") + "</nav>";

    var ps = FIN.filter(function (p) { return p.comp === m; }), acum = 0, x = 10 + m * slot + (slot - bw) / 2;
    ps.forEach(function (p) {
      var a = p.valor / max * (H - 30), cor = {paga: "#2f8f5b", atencao: "#ff8f3c", aprovacao: "#ffd83d", aprovada: "#4ade80", futura: "#3a4766"}[p.st] || "#3a4766";
      s += '<rect x="' + x + '" y="' + (H - 22 - acum - a) + '" width="' + bw + '" height="' + a + '" rx="2" fill="' + cor + '"' + (p.extra ? ' stroke="#7fb8ff" stroke-width="1.5"' : "") + "><title>" + esc(p.ref + ": " + brl(p.valor)) + "</title></rect>";
      acum += a;
    });
    s += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" fill="#96a0b4" font-size="10.5" text-anchor="middle">' + MESES[m] + "</text>";
  }
  h += s + "</svg></div>";
  h += '<div class="bloco rolavel"><table class="tab"><thead><tr><th>Competência</th><th>Referente a</th><th class="r">Valor</th><th>Medição prevista</th><th>Status</th><th>Ponto de atenção</th></tr></thead><tbody>' +
    FIN.slice().sort(function (a, b) { return a.comp - b.comp || (a.extra ? 1 : 0) - (b.extra ? 1 : 0); }).map(function (p) {
      var st = STATUS_FIN[p.st];
      return '<tr class="' + (p.extra ? "extra" : "") + '"><td class="num">' + MESES[p.comp] + "/26</td><td>" + esc(p.ref) + (p.quem ? '<span class="sub">Cadastrada por ' + esc(p.quem) + "</span>" : "") + '</td><td class="r num">' + brl(p.valor) + '</td><td class="num">' + p.med +
        '</td><td><span class="pill ' + st[1] + '">' + st[0] + "</span></td><td>" + esc(p.nota) + "</td></tr>";
    }).join("") + '<tr class="mais"><td colspan="6"><button data-nova-entrada><i class="ph ph-plus" aria-hidden="true"></i>Acrescentar uma entrada além do previsto (hora extra, serviço extra, aditivo)</button></td></tr></tbody></table></div>';
  return h;
}

/* ── os diálogos ─────────────────────────────────────────────────────────────────────────────────────────────── */
var dlg = document.getElementById("dlg");
function abrirDlg(html) { dlg.innerHTML = html; dlg.showModal(); var f = dlg.querySelector("input,select,textarea"); if (f) f.focus(); }
function rodapeDlg(rot) { return '<p class="nota">Fica registrado: <b>' + EU + "</b>, " + agoraTxt() + '.</p><div class="acoes"><button class="btn btn--prim" data-salvar>' + rot + '</button><button class="btn" data-fechar>Cancelar</button></div>'; }
function dlgRegra(i) {
  var r = i == null ? null : REGRAS[i];
  abrirDlg('<h2 id="dlg-t">' + (r ? "Ajustar: " + esc(r.nome) : "Regra acordada que não está no contrato") + "</h2>" +
    (r ? '<p class="nota">No contrato: <b>' + esc(r.contratual || "não está") + "</b>" + (r.acordada ? ". Acordada hoje: <b>" + esc(r.acordada) + "</b>" : "") + "</p>" : "") +
    (r ? "" : '<div class="dupla"><div class="campo"><label for="f-cat">Categoria</label><select id="f-cat">' + CATS.map(function (c) { return "<option>" + c + "</option>"; }).join("") + '</select></div><div class="campo"><label for="f-setor">Setor responsável</label><select id="f-setor"><option>Contratos</option><option>COS</option><option>Engenharia de O&M</option><option>Performance</option><option>PCM</option><option>Supervisão de Campo</option><option>Zeladoria</option></select></div></div><div class="campo"><label for="f-nome">Regra</label><input id="f-nome" placeholder="Ex.: Relatório de chuvas depois de evento extremo"></div>') +
    '<div class="campo"><label for="f-val">Como fica a regra</label><textarea id="f-val" rows="2" placeholder="Ex.: Até o 6º dia útil do mês seguinte">' + (r && r.acordada ? esc(r.acordada) : "") + "</textarea></div>" +
    '<div class="dupla"><div class="campo"><label for="f-orig">Origem</label><select id="f-orig"><option>Ata de reunião</option><option>E-mail do cliente</option><option>Aditivo</option><option>Ofício</option></select></div><div class="campo"><label for="f-desde">Vale a partir de</label><input id="f-desde" type="date" value="2026-11-13"></div></div>' +
    '<div class="campo"><label for="f-mot">Motivo</label><input id="f-mot" placeholder="Por que mudou"></div>' + rodapeDlg(r ? "Salvar o ajuste" : "Cadastrar a regra"));
  dlg.querySelector("[data-salvar]").onclick = function () {
    var val = dlg.querySelector("#f-val").value.trim(), orig = dlg.querySelector("#f-orig").value, mot = dlg.querySelector("#f-mot").value.trim() || "Sem motivo escrito.";
    if (!val) { toast("Escreva como fica a regra."); return; }
    if (r) {
      r.hist.unshift({quem: EU, setor: "Contratos", quando: agoraTxt(), de: (r.acordada || r.contratual || "Não estava no contrato") + (r.acordada ? "" : " (contratual)"), para: val, origem: orig, motivo: mot});
      r.acordada = val; estado.abertoHist[i] = true;
    } else {
      REGRAS.push({cat: dlg.querySelector("#f-cat").value, nome: dlg.querySelector("#f-nome").value.trim() || "Regra nova", setor: dlg.querySelector("#f-setor").value, cl: "", contratual: "", acordada: val,
                   hist: [{quem: EU, setor: "Contratos", quando: agoraTxt(), de: "Não estava no contrato", para: val, origem: orig, motivo: mot}]});
      estado.grupos[dlg.querySelector("#f-cat").value] = true;      // a regra nova aparece: a categoria dela abre
    }
    dlg.close(); render(); toast(r ? "Regra ajustada: a acordada passa a valer e a anterior fica no histórico." : "Regra cadastrada: vale a partir de hoje.");
  };
}
function dlgEntrada() {
  abrirDlg('<h2 id="dlg-t">Entrada além do previsto</h2>' +
    '<div class="campo"><label for="f-ref">Referente a</label><input id="f-ref" placeholder="Ex.: Lavagem extra de módulos da UFV Serra Azul 1"></div>' +
    '<div class="dupla"><div class="campo"><label for="f-vl">Valor (R$)</label><input id="f-vl" inputmode="decimal" placeholder="0,00"></div><div class="campo"><label for="f-comp">Competência</label><select id="f-comp">' + MESES.map(function (m, i) { return '<option value="' + i + '"' + (i === 11 ? " selected" : "") + ">" + m + "/26</option>"; }).join("") + "</select></div></div>" +
    '<div class="campo"><label for="f-med">Previsão de medição</label><input id="f-med" type="date" value="2027-01-11"></div>' + rodapeDlg("Cadastrar a entrada"));
  dlg.querySelector("[data-salvar]").onclick = function () {
    var ref = dlg.querySelector("#f-ref").value.trim(), vl = parseFloat((dlg.querySelector("#f-vl").value || "0").replace(/\./g, "").replace(",", "."));
    if (!ref || !(vl > 0)) { toast("Diga a que a entrada se refere e o valor."); return; }
    var dt = dlg.querySelector("#f-med").value.split("-");
    FIN.push({comp: +dlg.querySelector("#f-comp").value, ref: ref, valor: vl, med: dt[2] + "/" + dt[1] + "/" + dt[0], st: "futura", extra: true, quem: EU + " · 13/11/2026", nota: ""});
    dlg.close(); render(); toast("Entrada cadastrada como lançamento futuro.");
  };
}
dlg.addEventListener("click", function (e) { if (e.target.closest("[data-fechar]")) dlg.close(); });

/* ── rotas e eventos ─────────────────────────────────────────────────────────────────────────────────────────── */
var main = document.getElementById("main");
function render() {
  // "#/regras"; o endereço antigo ("#/contrato/regras") segue abrindo a mesma aba
  var r = (location.hash || "#/regras").replace("#/", "").split("/"), aba = r[0] === "contrato" ? r[1] : r[0];
  estado.aba = ABAS.some(function (a) { return a[0] === aba; }) ? aba : "regras";
  main.innerHTML = vContrato() + '<p class="rodape">Mockup para avaliação: o cliente, o CNPJ, as pessoas e as usinas são fictícios, “hoje” é 13/11/2026 e nada aqui grava.</p>';
}
var ultimaAba = "";
window.addEventListener("hashchange", function () { render(); if (estado.aba !== ultimaAba) window.scrollTo(0, 0); ultimaAba = estado.aba; });
main.addEventListener("click", function (e) {
  var b;
  if ((b = e.target.closest("[data-regras]"))) { estado.soAcordadas = b.getAttribute("data-regras") === "acordadas"; render(); }
  else if (e.target.closest("[data-ficha]")) { estado.ficha = !estado.ficha; render(); }
  else if ((b = e.target.closest("[data-grupo]"))) { var g = b.getAttribute("data-grupo"); estado.grupos[g] = !estado.grupos[g]; render(); }
  else if (e.target.closest("[data-voltar-ct]")) { estado.ct = 0; render(); }
  else if ((b = e.target.closest("[data-hist]"))) { var i = b.getAttribute("data-hist"); estado.abertoHist[i] = !estado.abertoHist[i]; render(); }
  else if ((b = e.target.closest("[data-ajustar]"))) dlgRegra(+b.getAttribute("data-ajustar"));
  else if (e.target.closest("[data-nova-regra]")) dlgRegra(null);
  else if ((b = e.target.closest("[data-at]"))) { estado.atModo = b.getAttribute("data-at"); render(); }
  else if ((b = e.target.closest("[data-ent]"))) { estado.entModo = b.getAttribute("data-ent"); render(); }
  else if ((b = e.target.closest("[data-kpi]"))) { estado.kpi = b.getAttribute("data-kpi"); render(); }
  else if ((b = e.target.closest("[data-agrup]"))) { estado.agrup = b.getAttribute("data-agrup"); render(); }
  else if (e.target.closest("[data-nova-entrada]")) dlgEntrada();
});
main.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "selCt") { estado.ct = +t.value; estado.ficha = false; render(); }
  else if (t.hasAttribute("data-marco")) {
    var m = MARCOS[+t.getAttribute("data-marco")]; m.u[t.getAttribute("data-u")] = t.checked;
    CARIMBO[m.nome] = EU + " · " + agoraTxt().slice(0, 5) + " " + agoraTxt().slice(11); render();
    toast(t.checked ? "Marcado como concluído no mês, com o seu nome e a hora." : "Desmarcado; o registro fica no histórico.");
  } else if (t.hasAttribute("data-marco-todo")) {
    var mm = MARCOS[+t.getAttribute("data-marco-todo")];
    Object.keys(mm.u).forEach(function (k) { if (mm.u[k] !== null) mm.u[k] = t.checked; });
    CARIMBO[mm.nome] = EU + " · " + agoraTxt().slice(0, 5) + " " + agoraTxt().slice(11) + ", contrato inteiro"; render();
    toast(t.checked ? "Concluído em todas as usinas do contrato." : "Desmarcado em todas as usinas.");
  }
});
render();
</script>
</body>
</html>
