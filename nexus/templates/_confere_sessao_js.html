{# A conferência da sessão do Fracttal, só para quem entrou por ele (`session.usuario`). Só JavaScript: entra dentro de um
   <script> do fim da página, depois do nexusRota (_raiz_js.html) e do nexusEntrarDeNovo (_entrar_de_novo_js.html). Vale
   na casca (base.html) e no modo TV do Painel NOC (performance/moldura_tv.html): a TV sem a casca também sai quando a
   sessão de quem a abriu acaba, e não fica mostrando o NOC de quem saiu. Saiu do base.html em 11/10/2026, sem mudar. #}
  (function () {
    // A sessão do Nexus vale enquanto a do Fracttal valer (Levi, 09/10/2026: "quando deslogar do Fracttal deslogue do
    // Nexus, tem que pedir para logar de novo"): a página pergunta ao abrir, ao voltar a ficar à vista e a cada 5 minutos.
    // O servidor pergunta ao Fracttal no máximo a cada 5 minutos por sessão (ponte.py, /os/_nexus/sessao). Servidor fora
    // ou rede caída não decide nada; só a sessão encerrada leva ao login.
    var ultimaConferencia = 0;
    function confereSessao() {
      if (document.visibilityState === "hidden" || Date.now() - ultimaConferencia < 60000) return;
      ultimaConferencia = Date.now();
      fetch(nexusRota("/os/_nexus/sessao"), {credentials: "same-origin", cache: "no-store", redirect: "manual"})
        .then(function (r) {
          // o portão respondeu com o login: a sessão do Nexus já tinha acabado
          if (r.type === "opaqueredirect") { window.nexusEntrarDeNovo(); return null; }
          if (r.status !== 200 && r.status !== 401) return null;
          return r.json().then(function (j) { if (j && j.sessao_encerrada) window.nexusEntrarDeNovo(j.entrar); });
        }).catch(function () {});
    }
    confereSessao();
    setInterval(confereSessao, 5 * 60 * 1000);
    document.addEventListener("visibilitychange", confereSessao);
  })();
